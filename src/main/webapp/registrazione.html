<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./css/registrazione.css"/>
    <title>PoliMusic - Registrazione</title>
</head>
<body>
<a href="./" class="back-home" title="Torna alla home">Torna alla home</a>

<div class="login-container">
    <div class="header">
        <h1>Unisciti a PoliMusic!</h1>
        <p class="welcome-text">Crea il tuo account</p>
    </div>

    <div id="errorMessage" class="error-message" style="display: none;">
        <span id="errorText"></span>
    </div>

    <form id="registrationForm" method="POST">
        <div class="form-grid">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text"
                           id="nome"
                           name="nome"
                           required
                           placeholder="Il tuo nome"
                           pattern="^[a-zA-Z0-9_]{3,}$"
                           minlength="3"
                           title="Il nome deve contenere almeno 3 caratteri alfanumerici o underscore">
                    <div class="input-icon"></div>
                    <div class="field-error" id="erroreNome">Il nome deve contenere almeno 3 caratteri</div>
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome *</label>
                    <input type="text"
                           id="cognome"
                           name="cognome"
                           required
                           placeholder="Il tuo cognome"
                           pattern="^[a-zA-Z0-9_]{3,}$"
                           minlength="3"
                           title="Il cognome deve contenere almeno 3 caratteri alfanumerici o underscore">
                    <div class="input-icon"></div>
                    <div class="field-error" id="erroreCognome">Il cognome deve contenere almeno 3 caratteri</div>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text"
                       id="username"
                       name="username"
                       required
                       placeholder="Scegli un nome utente unico"
                       pattern="^[a-zA-Z0-9_]{3,}$"
                       minlength="3"
                       title="L'username deve contenere almeno 3 caratteri alfanumerici o underscore">
                <div class="input-icon"></div>
                <div class="field-error" id="erroreUsername">L'username deve essere lungo almeno 3 caratteri</div>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       placeholder="Crea una password sicura"
                       pattern="^[a-zA-Z0-9_]{3,}$"
                       minlength="3"
                       title="La password deve contenere almeno 3 caratteri alfanumerici o underscore">
                <div class="input-icon"></div>
                <div class="field-error" id="errorePassword">La password deve essere lunga almeno 3 caratteri</div>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            <span id="btnText">Crea il mio account</span>
            <span id="btnLoader" class="btn-loader" style="display: none;">Creazione in corso...</span>
        </button>
    </form>

    <div class="signup-link">
        <p>Hai già un account? <a href="./login.html">Accedi qui</a></p>
    </div>
</div>

<script src="utils.js" charset="UTF-8"></script>
<script src="registrazione.js" charset="UTF-8"></script>

</body>
</html>
